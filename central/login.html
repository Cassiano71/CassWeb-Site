<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Central CassWeb</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/central/css/central.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/logo-crop.png" alt="CassWeb">
      </div>
      <h1>Central CassWeb</h1>
      <p class="subtitle">Acesso administrativo</p>

      <div class="form-error" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">ENTRAR</button>
      </form>

      <a href="/" class="back-link">← Voltar ao site</a>
    </div>
  </div>

  <script src="/central/js/login.js"></script>
</body>
</html>
